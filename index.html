<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESCRIPCIÓN DEL CIRCUITO</title>
    <link rel="stylesheet" href="menu_principal/main.css">
    <link rel="stylesheet" href="menu_principal/index.css">
</head>

<body>
    <div class="audio-control-wrapper">
        <div class="audio-player-container" id="audioContainer">
            <!-- Indicadores mejorados de que se puede expandir -->
            <div class="expand-indicators">
                <div class="expand-dot"></div>
                <div class="expand-dot"></div>
                <div class="expand-dot"></div>
            </div>

            <!-- Botón de play/pause -->
            <button class="play-pause-btn" id="playPauseBtn">
                <svg id="playIcon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>

            <!-- Controles expandidos -->
            <div class="expanded-controls">
                <div class="controls-column">
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill">
                                <div class="progress-thumb" id="progressThumb"></div>
                            </div>
                        </div>
                    </div>

                    <div class="volume-control">
                        <button class="volume-btn" id="volumeToggle">
                            <svg id="volumeIcon" viewBox="0 0 24 24">
                                <path
                                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
                            </svg>
                            <svg id="muteIcon" viewBox="0 0 24 24" style="display: none">
                                <path
                                    d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
                            </svg>
                        </button>

                        <div class="volume-slider" id="volumeSlider">
                            <div class="volume-fill" id="volumeFill"></div>
                        </div>
                    </div>
                </div>

                <button class="close-btn" id="closeBtn">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </div>

            <!-- Audio element -->
            <audio id="audioPlayer" preload="metadata">
                <source src="menu_principal/audio/index.wav" type="audio/wav" />
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
    </div>

    <div class="inicio-container">
        <video autoplay muted loop playsinline class="background-video">
            <source src="menu_principal/videos/inicio.mp4" type="video/mp4">
            Tu navegador no soporta el video HTML5.
        </video>
        <img src="menu_principal/images/logo_blanco.png" alt="Logo AngloAmerican" class="logo-inicio">

        <div class="contenido-centrado">
            <h1 class="inicio-title">Descripción del circuito</h1>
            <button id="empezarBtn" class="start-button">Comenzar</button>
            <!-- <p>Aprenderás las actividades de mejora continua paraprevenir errores, optimizando la gestión del mantenimiento y disponibilidad de equipos.</p> -->
        </div>
    </div>
    <script src="menu_principal/js/audioPlayer.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const video = document.querySelector(".background-video");
            video.playbackRate = 0.75;
        });

        document.getElementById('empezarBtn').addEventListener('click', () => {
            window.location.href = 'menu_principal/vista_general.html';
        });
    </script>
</body>

</html>
