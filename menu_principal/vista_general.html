<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESCRIPCIÓN DEL CIRCUITO</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="vista_general.css">
</head>

<body>
    <button class="back-page-btn" style="position: absolute; left: 0; top: 0;" onclick="backPage()">
        <span class="arrow">❮</span>
    </button>

    <div class="logo-container">
        <img src="images/logo_color.png" alt="Logo AngloAmerican" class="logo">
    </div>

    <div class="audio-control-wrapper">
        <div class="audio-player-container" id="audioContainer">
            <!-- Indicadores mejorados de que se puede expandir -->
            <div class="expand-indicators">
                <div class="expand-dot"></div>
                <div class="expand-dot"></div>
                <div class="expand-dot"></div>
            </div>

            <!-- Botón de play/pause -->
            <button class="play-pause-btn" id="playPauseBtn">
                <svg id="playIcon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>

            <!-- Controles expandidos -->
            <div class="expanded-controls">
                <div class="controls-column">
                    <div class="progress-container">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill">
                                <div class="progress-thumb" id="progressThumb"></div>
                            </div>
                        </div>
                    </div>

                    <div class="volume-control">
                        <button class="volume-btn" id="volumeToggle">
                            <svg id="volumeIcon" viewBox="0 0 24 24">
                                <path
                                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
                            </svg>
                            <svg id="muteIcon" viewBox="0 0 24 24" style="display: none">
                                <path
                                    d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
                            </svg>
                        </button>

                        <div class="volume-slider" id="volumeSlider">
                            <div class="volume-fill" id="volumeFill"></div>
                        </div>
                    </div>
                </div>

                <button class="close-btn" id="closeBtn">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </div>

            <!-- Audio element -->
            <audio id="audioPlayer" preload="metadata">
                <source src="audio/menu-principal.wav" type="audio/wav" />
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
    </div>

    <div class="main-container">
        <header class="page-header">
            <h1 class="gradient-text">Descripción del Circuito</h1>
            <h4>Elige aquí el curso con el que quieres comenzar tu aprendizaje</h4>
        </header>

        <main>
            <div class="grid-container">
                <div class="card" style="background-image: url('images/caratulas/curso1.png');">
                    <img src="images/logo_blanco.png" alt="Logo AngloAmerican" class="logo-inicio">
                    <div class="inicio-box">
                        <!-- <span class="inicio-module-number">01</span> -->
                        <h1 class="inicio-title">Descripción del Circuito</h1>
                        <button id="empezarBtn-1" class="start-button-card">Comenzar</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="typeModal" class="modal">
        <div class="modal-content">
            <button class="modal-close-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="modal-text-content">
                <h3 id="modalCode"></h3>
                <p id="modalDescription"></p>
            </div>

            <img id="modalImage" src="" alt="Imagen de rodamiento" class="modal-image">
        </div>
    </div>

    <script src="js/audioPlayer.js"></script>
    <script src="js/SCORM.js"></script>
    <script>
        // redireccion al modulo de rodamientos
        document.getElementById('empezarBtn-1').addEventListener('click', () => {
            window.location.href = '../mod1_descripcion_del_circuito/index.html';
        });

        function backPage() {
            window.location.href = '../index.html';
        }

        const CURSOS = [
        { id: 'mod1', btn: 'empezarBtn-1', url: '../mod1_descripcion_del_circuito/index.html', curso: 'curso1' }
    ];


    function getSuspendData() {
        let data = {};
        try {
            // Usar directamente el helper de tu ScormManager
            const raw = ScormManager.getValue('cmi.suspend_data');
            if (raw) {
                data = JSON.parse(raw);

            } else {
                console.log('⚠️ No hay suspend_data disponible (puede ser primera vez o no existe).');
                // Respaldo opcional en localStorage
                const local = localStorage.getItem('scorm_suspend_data');
                if (local) {
                    data = JSON.parse(local);
                    console.log('📦 Datos recuperados de localStorage:', data);
                }
            }
        } catch (e) {
            console.warn('❌ Error leyendo/parsing suspend_data:', e);
            data = {};
        }

        return data;
    }

        document.addEventListener('DOMContentLoaded', () => {
        ScormManager.init();
        const data = getSuspendData();
        const fullIDs = ScormManager.getFullCursoIDs();
        CURSOS.forEach((curso, index) => {
            const btn = document.getElementById(curso.btn);

            // Si es el primero, siempre habilitado
            if (index === 0) {
                btn.disabled = false;
                btn.addEventListener('click', () => window.location.href = curso.url);
                // Mostrar progreso si existe
                const cursoID = fullIDs[curso.curso];
                const progreso = data[cursoID]?.progreso || 0;
                console.log(`✅ ${curso.curso}: ${progreso}% completado`);
                return;
            }

            // Validar progreso del curso anterior
            const cursoAnterior = CURSOS[index - 1];
            const cursoAnteriorID = fullIDs[cursoAnterior.curso];
            const progresoAnterior = data[cursoAnteriorID]?.progreso || 0;

            console.log(`📊 Verificando ${cursoAnterior.curso} (ID: ${cursoAnteriorID}): ${progresoAnterior}%`);

            if (progresoAnterior >= 100) {
                btn.disabled = false;
                btn.addEventListener('click', () => window.location.href = curso.url);
                console.log(`✅ ${curso.curso} desbloqueado`);

                // Mostrar progreso del curso actual si existe
                const cursoActualID = fullIDs[curso.curso];
                const progresoActual = data[cursoActualID]?.progreso || 0;
                console.log(`   └─ Progreso actual: ${progresoActual}%`);
            } else {
                btn.disabled = true;
                btn.classList.add('bloqueado');
                console.log(`🔒 ${curso.curso} bloqueado (falta completar ${cursoAnterior.curso})`);
            }
        });
    });
    </script>
</body>

</html>
